{{- if .Values.sdlc.enabled }}
{{- if or .Values.sdlc.llm.baseUrl .Values.sdlc.llm.model }}
{{- $_ := required "Set sdlc.llm.baseUrl for LiteLLM" .Values.sdlc.llm.baseUrl }}
{{- $_ := required "Set sdlc.llm.model for LiteLLM" .Values.sdlc.llm.model }}
{{- if not (or .Values.sdlc.llm.apiKey .Values.sdlc.llm.existingSecret) }}
{{- fail "Set sdlc.llm.apiKey or sdlc.llm.existingSecret for LiteLLM" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: opencode
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      serviceAccountName: opencode
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tmp-home
          emptyDir: {}
      containers:
        - name: opencode
          image: {{ .Values.sdlc.opencodeImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["opencode"]
          args:
            - serve
            - --hostname=0.0.0.0
            - --port=4096
            - --print-logs
            - --log-level={{ .Values.sdlc.opencodeLogLevel | default "INFO" }}
          env:
            - name: HOME
              value: /tmp
            - name: XDG_DATA_HOME
              value: /tmp
            - name: OPENCODE_SERVER_USERNAME
              value: {{ .Values.sdlc.opencodeServerUsername | quote }}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-server
                  key: password
            - name: GITLAB_URL
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: url
            - name: GITLAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: password
            - name: GITLAB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: username
            - name: GITLAB_PAT
              valueFrom:
                secretKeyRef:
                  name: gitlab-root-pat
                  key: token
            {{- if or .Values.sdlc.llm.apiKey .Values.sdlc.llm.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bootstrap-tenant.opencodeLlmSecretName" . }}
                  key: api_key
            {{- end }}
            {{- if .Values.sdlc.llm.baseUrl }}
            - name: OPENCODE_CONFIG_CONTENT
              value: {{ dict "model" (printf "litellm/%s" .Values.sdlc.llm.model) "provider" (dict "litellm" (dict "npm" "@ai-sdk/openai-compatible" "name" "LiteLLM" "options" (dict "baseURL" .Values.sdlc.llm.baseUrl "apiKey" "{env:OPENAI_API_KEY}") "models" (dict .Values.sdlc.llm.model (dict "name" .Values.sdlc.llm.model)))) | toJson | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp-home
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: http
{{- if .Values.sdlc.exposeUi }}
---
# The OpenCode server ships an embedded web UI at / that renders each agent
# session as a readable transcript — the only place the agent's reasoning and
# tool calls are visible. AAP job output shows just the five tasks that launch
# the agent, and the pod log shows only server startup. Worth exposing for
# demos and debugging; the server enforces its own basic auth (opencode /
# sdlc.opencodeServerPassword), so the route is not anonymous.
#
# Sessions live in an emptyDir under $HOME=/tmp, so they do not survive a pod
# restart. Avoid rolling this Deployment mid-demo.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: opencode-ui
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  to:
    kind: Service
    name: opencode
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
